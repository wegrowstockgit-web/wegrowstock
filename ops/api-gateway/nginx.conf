# API Gateway edge: sole public entry to the Spring API.
# Dynamic CORS whitelist is enforced by ApiGatewayCorsFilter upstream — do not add
# static Access-Control-* headers here.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Edge rate-limit matrices (per client IP)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=scan_limit:10m rate=120r/m;

    upstream invsys_backend {
        server backend:8080;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # Actuator scrape endpoints stay on the Compose network (backend:8080).
        # Public edge only proxies shallow liveness for the gateway healthcheck.
        location = /actuator/prometheus {
            return 404;
        }

        location /actuator/ {
            return 404;
        }

        location = /actuator/health {
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth magic-link: strict throttle (5 req/min/IP)
        location = /api/v1/auth/magic-login {
            limit_req zone=auth_limit burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass_header Set-Cookie;
            proxy_pass_header X-Request-Id;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Expose-Headers;
            proxy_pass_header Access-Control-Max-Age;
            proxy_pass_header Vary;
        }

        # Warehouse scanner ingest: high-throughput throttle (120 req/min/IP)
        location = /api/v1/fulfillment/scan {
            limit_req zone=scan_limit burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass_header Set-Cookie;
            proxy_pass_header X-Request-Id;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Expose-Headers;
            proxy_pass_header Access-Control-Max-Age;
            proxy_pass_header Vary;
        }

        # SSE: disable buffering so dashboard stream events flush immediately.
        location = /api/v1/dashboard/stream {
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # SSE: role-aware support RAG chat (X-User-Roles / X-Current-Route).
        location = /api/v1/support/chat {
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-User-Roles $http_x_user_roles;
            proxy_set_header X-Current-Route $http_x_current_route;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        location / {
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-User-Roles $http_x_user_roles;
            proxy_set_header X-Current-Route $http_x_current_route;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass_header Set-Cookie;
            proxy_pass_header X-Request-Id;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Expose-Headers;
            proxy_pass_header Access-Control-Max-Age;
            proxy_pass_header Vary;
        }
    }
}
