# API Gateway edge: sole public entry to the Spring APIs.
# Dynamic CORS whitelist is enforced by ApiGatewayCorsFilter upstream — do not add
# static Access-Control-* headers here.
#
# Data plane (app.invsys.com / :8080):
#   /api/v1/              → invsys-app (backend:8080)
#   /api/v1/control-plane → BLOCKED (404)
# Control plane (admin.invsys.com / :8081):
#   /api/v1/control-plane → invsys-admin-api (backend-admin:8081)
#   /                     → frontend_admin (when present)
# IP allowlist via geo $admin_allowed (deny-all by default; RFC1918 + loopback only).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=scan_limit:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=admin_auth_limit:10m rate=10r/s;

    # Control-plane allowlist: public internet is denied. $admin_allowed=0 → 403
    # on the :8081 server (invsys-admin-api + frontend_admin upstreams).
    # Loopback + RFC1918 stay open for Docker / office LAN. Do not publish :8081
    # on 0.0.0.0 — Docker SNAT would make $remote_addr look internal.
    geo $admin_allowed {
        default 0;
        127.0.0.1 1;
        ::1 1;
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;
    }

    upstream invsys_backend {
        server backend:8080;
        keepalive 32;
    }

    upstream invsys_admin_backend {
        server backend-admin:8081;
        keepalive 16;
    }

    upstream frontend_wms_upstream {
        server frontend:80;
        keepalive 8;
    }

    upstream frontend_admin_upstream {
        server frontend-admin:80;
        keepalive 8;
    }

    # Shared proxy headers snippet via repeated blocks (nginx alpine has no include fragments mounted).

    # -------------------------------------------------------------------------
    # DATA PLANE — app.invsys.com
    # -------------------------------------------------------------------------
    server {
        listen 8080;
        server_name app.invsys.com localhost _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location = /swagger-ui.html { return 404; }
        location ^~ /swagger-ui/ { return 404; }
        location ^~ /api-docs { return 404; }
        location ^~ /v3/api-docs { return 404; }

        location = /actuator/prometheus {
            return 404;
        }

        location /actuator/ {
            return 404;
        }

        location = /actuator/health {
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Hard-block control-plane APIs on the data-plane edge
        location ^~ /api/v1/control-plane {
            return 404;
        }

        location = /api/v1/auth/discovery {
            limit_req zone=auth_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/login {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location = /api/v1/auth/signup {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location = /api/v1/auth/impersonation/accept {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location = /api/v1/auth/magic-login {
            limit_req zone=auth_limit burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass_header Set-Cookie;
            proxy_pass_header X-Request-Id;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Expose-Headers;
            proxy_pass_header Access-Control-Max-Age;
            proxy_pass_header Vary;
        }

        location = /api/v1/fulfillment/scan {
            limit_req zone=scan_limit burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass_header Set-Cookie;
            proxy_pass_header X-Request-Id;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Expose-Headers;
            proxy_pass_header Access-Control-Max-Age;
            proxy_pass_header Vary;
        }

        location = /api/v1/dashboard/stream {
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        location = /api/v1/support/chat {
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-User-Roles "";
            proxy_set_header X-Current-Route $http_x_current_route;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        location /api/v1/ {
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-User-Roles "";
            proxy_set_header X-Current-Route $http_x_current_route;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass_header Set-Cookie;
            proxy_pass_header X-Request-Id;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Expose-Headers;
            proxy_pass_header Access-Control-Max-Age;
            proxy_pass_header Vary;
        }

        # Host-based SPA: when Host is app.invsys.com serve WMS UI; otherwise keep API default
        # for local clients that still hit :8080 for JSON only.
        location / {
            # Prefer WMS UI when the dedicated hostname is used
            set $upstream_default invsys_backend;
            if ($host = "app.invsys.com") {
                set $upstream_default frontend_wms_upstream;
            }
            proxy_pass http://$upstream_default;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-User-Roles "";
            proxy_set_header X-Current-Route $http_x_current_route;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass_header Set-Cookie;
            proxy_pass_header X-Request-Id;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Expose-Headers;
            proxy_pass_header Access-Control-Max-Age;
            proxy_pass_header Vary;
        }
    }

    # -------------------------------------------------------------------------
    # CONTROL PLANE — admin.invsys.com
    # -------------------------------------------------------------------------
    server {
        listen 8081;
        server_name admin.invsys.com localhost;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        if ($admin_allowed = 0) {
            return 403;
        }

        location = /actuator/health {
            proxy_pass http://invsys_admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/control-plane/auth/login {
            limit_req zone=admin_auth_limit burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://invsys_admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass_header Set-Cookie;
        }

        location /api/v1/control-plane/ {
            proxy_pass http://invsys_admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass_header Set-Cookie;
            proxy_pass_header X-Request-Id;
        }

        location /api/ {
            return 404;
        }

        location / {
            proxy_pass http://frontend_admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
