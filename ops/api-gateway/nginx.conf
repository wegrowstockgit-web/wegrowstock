# API Gateway edge: sole public entry to the Spring API.
# Dynamic CORS whitelist is enforced by ApiGatewayCorsFilter upstream — do not add
# static Access-Control-* headers here.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    upstream invsys_backend {
        server backend:8080;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # Prometheus scrapes backend:8080 on the Compose network — never via the public edge.
        location = /actuator/prometheus {
            return 404;
        }

        # SSE: disable buffering so dashboard stream events flush immediately.
        location = /api/v1/dashboard/stream {
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        location / {
            proxy_pass http://invsys_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass_header Set-Cookie;
            proxy_pass_header X-Request-Id;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Expose-Headers;
            proxy_pass_header Access-Control-Max-Age;
            proxy_pass_header Vary;
        }
    }
}
