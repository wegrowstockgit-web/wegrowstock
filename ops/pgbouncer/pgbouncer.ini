;; InvSys PgBouncer — transaction pooling in front of Postgres 16
[databases]
invsys = host=db port=5432 dbname=invsys

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = app_user
stats_users = app_user
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 40
reserve_pool_size = 5
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,options,search_path
max_prepared_statements = 100
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
