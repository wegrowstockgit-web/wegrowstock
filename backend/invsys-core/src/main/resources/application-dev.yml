spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev-seed
  config:
    activate:
      on-profile: dev
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: "false"
      mail.smtp.starttls.enable: "false"

management:
  health:
    mail:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
    export:
      # Off by default for IDE runs; enable when a local Tempo is reachable.
      otlp:
        enabled: ${OTEL_TRACING_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
          transport: http

invsys:
  dev:
    auto-seed: true
  jwt:
    allow-ephemeral: true
  security:
    cookie-secure: false
    cookie-same-site: Lax
    expose-magic-token: true
    public-signup-enabled: true
  redis:
    enabled: false
  observability:
    loki-url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}
  support:
    ai:
      # Local dev: gemini when GEMINI_API_KEY is set; override with SUPPORT_AI_LLM=heuristic if not
      llm: ${SUPPORT_AI_LLM:gemini}
