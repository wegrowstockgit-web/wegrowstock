spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev-seed
  config:
    activate:
      on-profile: dev
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: "false"
      mail.smtp.starttls.enable: "false"

management:
  health:
    mail:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
    export:
      # Off by default for IDE runs; enable when a local Tempo is reachable.
      otlp:
        enabled: ${OTEL_TRACING_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
          transport: http

invsys:
  dev:
    auto-seed: true
  jwt:
    allow-ephemeral: true
  stripe:
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock_secret}
    platform-webhook-secret: ${STRIPE_PLATFORM_WEBHOOK_SECRET:${STRIPE_WEBHOOK_SECRET:whsec_mock_secret}}
    secret-key: ${STRIPE_SECRET_KEY:sk_test_mock}
  easypost:
    api-key: ${EASYPOST_API_KEY:easypost_mock_key}
  shopify:
    api-key: ${SHOPIFY_API_KEY:shopify_mock_key}
  webhooks:
    shopify-secret: ${SHOPIFY_WEBHOOK_SECRET:shopify_mock_secret}
    easypost-secret: ${EASYPOST_WEBHOOK_SECRET:easypost_mock_secret}
    accounting-secret: ${ACCOUNTING_WEBHOOK_SECRET:accounting_mock_secret}
  media:
    access-key: ${MEDIA_ACCESS_KEY:invsys}
    secret-key: ${MEDIA_SECRET_KEY:invsyssecret}
  security:
    cookie-secure: false
    cookie-same-site: Lax
    expose-magic-token: true
    public-signup-enabled: true
  redis:
    enabled: false
  observability:
    loki-url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}
  support:
    ai:
      # Local dev: gemini when GEMINI_API_KEY is set; override with SUPPORT_AI_LLM=heuristic if not
      llm: ${SUPPORT_AI_LLM:gemini}
