spring:
  application:
    name: invsys-api
  autoconfigure:
    # Prefer invsys-chatbot RagConfig (Flyway table support_knowledge_chunks) over Spring AI defaults.
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      # Dashboard SSE emitters live up to 30m; Tomcat's default ~30s async timeout
      # otherwise fires AsyncRequestTimeoutException and ERROR log spam.
      request-timeout: 35m
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  ai:
    # google-genai activates when GEMINI_API_KEY is set. Override to none for headless boots without a key.
    # Tests force none via application-test.yml.
    chat:
      client:
        enabled: true
    # Fail fast on free-tier 429s — default Spring AI retries (10× exponential) stall the copilot for ~40–80s.
    retry:
      max-attempts: ${SPRING_AI_RETRY_MAX_ATTEMPTS:1}
      exclude-on-http-codes: ${SPRING_AI_RETRY_EXCLUDE_ON_HTTP_CODES:429}
    model:
      chat: ${SPRING_AI_MODEL_CHAT:google-genai}
      embedding:
        text: ${SPRING_AI_MODEL_EMBEDDING_TEXT:google-genai}
        multimodal: ${SPRING_AI_MODEL_EMBEDDING_MULTIMODAL:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL:gemini-2.5-flash}
            temperature: 0.2
        embedding:
          # Separate connection prefix from chat (GoogleGenAiEmbeddingConnectionProperties)
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: text-embedding-004
  modulith:
    # Bounded contexts are com.invsys.modules.* (boot class lives in com.invsys).
    detection-strategy: com.invsys.modules.BoundedContextDetectionStrategy
  datasource:
    # prepareThreshold=0: inline binds (safe for PgBouncer transaction pooling and direct Postgres).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invsys}?prepareThreshold=0
    # Data-plane role is not overridable via DB_USER — WMS must never log in as app_owner.
    username: app_user
    password: ${DB_APP_USER_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Fail-closed RLS wipe whenever Hikari validates/creates a physical connection.
      connection-init-sql: "SELECT set_config('app.current_tenant', '', false)"
  flyway:
    enabled: true
    user: app_owner
    password: ${DB_APP_OWNER_PASSWORD:${FLYWAY_PASSWORD:}}
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: UUID

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
    prometheus:
      enabled: true
  health:
    db:
      enabled: true
    # Prod/base: SMTP must not fail readiness. Dev/docker profiles enable this against Mailpit.
    mail:
      enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  observations:
    annotations:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        invsys.scan.lookup: true
        invsys.fulfillment.scan: true
        wms.allocation.time: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        invsys.scan.lookup: 0.5,0.95,0.99
        invsys.fulfillment.scan: 0.5,0.95,0.99
        wms.allocation.time: 0.5,0.95,0.99

invsys:
  features:
    # Optional Support Co-Pilot / training module (invsys-chatbot). When false, beans are not loaded.
    chatbot:
      enabled: ${INVSYS_CHATBOT_ENABLED:true}
  jwt:
    access-token-minutes: 15
    terminal-switch-token-minutes: 5
    refresh-token-days: 7
    private-key-pem: ${JWT_PRIVATE_KEY:}
    public-key-pem: ${JWT_PUBLIC_KEY:}
    allow-ephemeral: ${JWT_ALLOW_EPHEMERAL:false}
  stripe:
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock_secret}
    platform-webhook-secret: ${STRIPE_PLATFORM_WEBHOOK_SECRET:${STRIPE_WEBHOOK_SECRET:whsec_mock_secret}}
    secret-key: ${STRIPE_SECRET_KEY:sk_test_mock}
    platform-fee-percent: 0.4
    connect-return-url: ${STRIPE_CONNECT_RETURN_URL:http://localhost:3000/settings/billing?stripe=success}
  easypost:
    api-key: ${EASYPOST_API_KEY:easypost_mock_key}
    # Ship-from defaults used by LiveEasyPostGateway (prod). Ignored by MockEasyPostGateway.
    default-from:
      name: ${EASYPOST_FROM_NAME:Demo Warehouse}
      company: ${EASYPOST_FROM_COMPANY:InventorySystem}
      street1: ${EASYPOST_FROM_STREET1:100 Warehouse Way}
      street2: ${EASYPOST_FROM_STREET2:}
      city: ${EASYPOST_FROM_CITY:Chicago}
      state: ${EASYPOST_FROM_STATE:IL}
      zip: ${EASYPOST_FROM_ZIP:60601}
      country: ${EASYPOST_FROM_COUNTRY:US}
      phone: ${EASYPOST_FROM_PHONE:}
      email: ${EASYPOST_FROM_EMAIL:}
  shopify:
    api-key: ${SHOPIFY_API_KEY:shopify_mock_key}
    api-version: ${SHOPIFY_API_VERSION:2024-10}
  webhooks:
    shopify-secret: ${SHOPIFY_WEBHOOK_SECRET:shopify_mock_secret}
    easypost-secret: ${EASYPOST_WEBHOOK_SECRET:easypost_mock_secret}
    accounting-secret: ${ACCOUNTING_WEBHOOK_SECRET:accounting_mock_secret}
  security:
    public-signup-enabled: ${PUBLIC_SIGNUP_ENABLED:false}
    expose-magic-token: ${EXPOSE_MAGIC_TOKEN:false}
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-window-minutes: ${LOGIN_WINDOW_MINUTES:10}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5175,http://localhost:3003,http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:5175,http://127.0.0.1:3003}
    # DNS-ACTIVE tenant domains are published as https://{domain} (+ www) at the API gateway edge
    cors-include-verified-domains: ${CORS_INCLUDE_VERIFIED_DOMAINS:true}
    cors-cache-seconds: ${CORS_CACHE_SECONDS:30}
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:Strict}
  redis:
    # Opt-in: enable via REDIS_ENABLED=true (docker/prod). Local/tests use in-memory fallbacks.
    enabled: ${REDIS_ENABLED:false}
  actuator:
    # Prometheus / Grafana / Docker / localhost probes may scrape health + prometheus anonymously.
    scrape-allowed-cidrs: ${ACTUATOR_SCRAPE_ALLOWED_CIDRS:127.0.0.1/32,::1/128}
  rate-limit:
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:60}
    terminal-pin-per-minute: ${TERMINAL_PIN_RATE_LIMIT_PER_MINUTE:20}
    webhook-per-minute: ${WEBHOOK_RATE_LIMIT_PER_MINUTE:120}
  alerts:
    from-email: ${ALERTS_FROM_EMAIL:noreply@invsys.local}
    debounce-minutes: ${ALERT_DEBOUNCE_MINUTES:60}
  observability:
    alert-scan-interval-ms: ${ALERT_SCAN_INTERVAL_MS:300000}
  inventory:
    level-flush:
      enabled: true
      batch-size: 200
      poll-interval-ms: 100
  replenishment:
    predictive:
      enabled: true
      poll-interval-ms: 300000
  integration:
    # LOCAL (dev/test) | AWS_KMS | HASHICORP_VAULT — wraps per-secret AES-GCM data keys
    vault-provider: ${INTEGRATION_VAULT_PROVIDER:LOCAL}
    master-key: ${INTEGRATION_MASTER_KEY:}
    aws-kms-key-id: ${INTEGRATION_AWS_KMS_KEY_ID:}
    aws-region: ${INTEGRATION_AWS_REGION:us-east-1}
    vault-address: ${INTEGRATION_VAULT_ADDRESS:}
    vault-token: ${INTEGRATION_VAULT_TOKEN:}
    vault-transit-key: ${INTEGRATION_VAULT_TRANSIT_KEY:invsys-credentials}
    outbox:
      batch-size: 20
      max-retries: 5
      poll-interval-ms: 5000
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  media:
    # AWS | GCP | AZURE | DIGITALOCEAN | MINIO | CUSTOM — S3-compatible only (no local disk)
    provider: ${MEDIA_PROVIDER:MINIO}
    bucket: ${MEDIA_BUCKET:invsys-media}
    region: ${MEDIA_REGION:us-east-1}
    endpoint: ${MEDIA_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MEDIA_PUBLIC_ENDPOINT:}
    access-key: ${MEDIA_ACCESS_KEY:invsys}
    secret-key: ${MEDIA_SECRET_KEY:invsyssecret}
    path-style-access: ${MEDIA_PATH_STYLE:true}
    create-bucket-if-missing: ${MEDIA_CREATE_BUCKET:true}
    max-bytes: 15728640
    avatar-max-bytes: 2097152
    evidence-max-bytes: 10485760
    allow-private-endpoints: ${MEDIA_ALLOW_PRIVATE_ENDPOINTS:false}
  audit:
    archive:
      enabled: ${AUDIT_ARCHIVE_ENABLED:true}
      retention-days: ${AUDIT_ARCHIVE_RETENTION_DAYS:90}
      batch-size: ${AUDIT_ARCHIVE_BATCH_SIZE:5000}
      # Nightly 02:00 UTC; override in IT for Awaitility-driven scheduling
      cron: ${AUDIT_ARCHIVE_CRON:0 0 2 * * ?}
  support:
    ai:
      enabled: ${SUPPORT_AI_ENABLED:true}
      # gemini (default) | heuristic | openai — tests override to heuristic
      llm: ${SUPPORT_AI_LLM:gemini}
      top-k: ${SUPPORT_AI_TOP_K:4}
      # Extra Gemini call before embed — keep off unless embeddings are real + queries are hard
      hyde-enabled: ${SUPPORT_AI_HYDE_ENABLED:false}
      # Second vector search on top of hybrid GraphRAG — keep off to save tokens/latency
      question-answer-advisor-enabled: ${SUPPORT_AI_QA_ADVISOR_ENABLED:false}
    sop:
      directory-ingestion:
        # Auto-scan docs/sops/*.md (or classpath:docs/sops) on startup via SopDirectoryIngestionRunner.
        enabled: ${INVSYS_SOP_DIRECTORY_INGESTION_ENABLED:true}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} tenant=%X{tenantId} req=%X{requestId} user=%X{userId} - %msg%n"
