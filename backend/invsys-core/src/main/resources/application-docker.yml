spring:
  config:
    activate:
      on-profile: docker
  datasource:
    # App traffic → PgBouncer (transaction pooling). prepareThreshold=0 avoids
    # unnamed prepared-statement issues across pooled server connections.
    url: jdbc:postgresql://pgbouncer:6432/invsys?prepareThreshold=0
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-init-sql: "SELECT set_config('app.current_tenant', '', false)"
  flyway:
    # Migrations stay on direct Postgres (advisory locks / DDL are session-sensitive).
    url: jdbc:postgresql://db:5432/invsys?prepareThreshold=0
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: "false"
      mail.smtp.starttls.enable: "false"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # Scrape CIDRs are IP-gated in Spring Security; expose component details to Prometheus/Grafana.
      show-details: when_authorized
      show-components: when_authorized
    prometheus:
      enabled: true
  health:
    mail:
      enabled: true
  # Metrics stay on Prometheus scrape; Tempo is traces-only in this stack.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318}
          transport: http

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

invsys:
  redis:
    enabled: true
  # Playwright / demo traffic issues many short-lived logins from one gateway IP.
  rate-limit:
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:2000}
    terminal-pin-per-minute: ${TERMINAL_PIN_RATE_LIMIT_PER_MINUTE:200}
    webhook-per-minute: ${WEBHOOK_RATE_LIMIT_PER_MINUTE:600}
  security:
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    expose-magic-token: ${EXPOSE_MAGIC_TOKEN:true}
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:172.16.0.0/12,10.0.0.0/8}
    # Keep alongside cookie overrides — some Boot versions replace nested maps per document.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5175,http://localhost:3003,http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:5175,http://127.0.0.1:3003}
    cors-include-verified-domains: ${CORS_INCLUDE_VERIFIED_DOMAINS:true}
    public-signup-enabled: ${PUBLIC_SIGNUP_ENABLED:true}
  jwt:
    private-key-file: ${JWT_PRIVATE_KEY_FILE:/run/jwt/dev-private.pem}
    public-key-file: ${JWT_PUBLIC_KEY_FILE:/run/jwt/dev-public.pem}
  media:
    provider: MINIO
    endpoint: http://minio:9000
    public-endpoint: ${MEDIA_PUBLIC_ENDPOINT:http://localhost:9000}
    bucket: invsys-media
    region: us-east-1
    access-key: ${MEDIA_ACCESS_KEY:invsys}
    secret-key: ${MEDIA_SECRET_KEY:invsyssecret}
    path-style-access: true
    create-bucket-if-missing: true
    allow-private-endpoints: true
  observability:
    loki-url: ${LOKI_URL:http://loki:3100/loki/api/v1/push}
