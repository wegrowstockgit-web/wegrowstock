spring:
  application:
    name: invsys-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invsys}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_user_secret}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    user: ${FLYWAY_USER:app_owner}
    password: ${FLYWAY_PASSWORD:app_owner_secret}
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: UUID

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        invsys.scan.lookup: true
        invsys.fulfillment.scan: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        invsys.scan.lookup: 0.5,0.95,0.99
        invsys.fulfillment.scan: 0.5,0.95,0.99

invsys:
  jwt:
    access-token-minutes: 15
    terminal-switch-token-minutes: 5
    refresh-token-days: 7
    private-key-pem: ${JWT_PRIVATE_KEY:}
    public-key-pem: ${JWT_PUBLIC_KEY:}
  stripe:
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock_secret}
    platform-fee-percent: 0.4
    connect-return-url: ${STRIPE_CONNECT_RETURN_URL:http://localhost:3000/settings}
  webhooks:
    shopify-secret: ${SHOPIFY_WEBHOOK_SECRET:shopify_mock_secret}
    easypost-secret: ${EASYPOST_WEBHOOK_SECRET:easypost_mock_secret}
    accounting-secret: ${ACCOUNTING_WEBHOOK_SECRET:accounting_mock_secret}
  security:
    public-signup-enabled: ${PUBLIC_SIGNUP_ENABLED:true}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  observability:
    alert-scan-interval-ms: ${ALERT_SCAN_INTERVAL_MS:300000}
  integration:
    master-key: ${INTEGRATION_MASTER_KEY:}
    outbox:
      batch-size: 20
      max-retries: 5
      poll-interval-ms: 5000
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} tenant=%X{tenantId} req=%X{requestId} user=%X{userId} - %msg%n"
