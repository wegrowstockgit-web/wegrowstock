spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Prefer PgBouncer in front of Postgres (DB_HOST/DB_PORT point at the pooler).
    url: jdbc:postgresql://${DB_HOST:pgbouncer}:${DB_PORT:6432}/${DB_NAME:invsys}?prepareThreshold=0
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  flyway:
    # Prefer a direct Postgres endpoint for migrations when available.
    url: jdbc:postgresql://${FLYWAY_HOST:${DB_HOST:pgbouncer}}:${FLYWAY_PORT:5432}/${DB_NAME:invsys}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

invsys:
  security:
    public-signup-enabled: ${PUBLIC_SIGNUP_ENABLED:false}
  stripe:
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    secret-key: ${STRIPE_SECRET_KEY}
    connect-return-url: ${STRIPE_CONNECT_RETURN_URL}
  easypost:
    api-key: ${EASYPOST_API_KEY}
  shopify:
    api-key: ${SHOPIFY_API_KEY}
    api-version: ${SHOPIFY_API_VERSION:2024-10}
  webhooks:
    shopify-secret: ${SHOPIFY_WEBHOOK_SECRET}
    easypost-secret: ${EASYPOST_WEBHOOK_SECRET}
    accounting-secret: ${ACCOUNTING_WEBHOOK_SECRET}
  jwt:
    private-key-pem: ${JWT_PRIVATE_KEY}
    public-key-pem: ${JWT_PUBLIC_KEY}
  integration:
    master-key: ${INTEGRATION_MASTER_KEY}
  frontend-url: ${FRONTEND_URL}
