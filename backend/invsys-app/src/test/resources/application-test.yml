spring:
  ai:
    model:
      # Keep Spring AI providers off in CI unless an explicit override + key is supplied
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding:
        text: ${SPRING_AI_MODEL_EMBEDDING_TEXT:none}
        multimodal: ${SPRING_AI_MODEL_EMBEDDING_MULTIMODAL:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL:gemini-2.5-flash}
            temperature: 0.2
        embedding:
          text:
            options:
              model: text-embedding-004
  flyway:
    enabled: true
    user: app_owner
    password: app_owner_secret
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: UUID
  task:
    scheduling:
      enabled: false

invsys:
  support:
    ai:
      llm: ${SUPPORT_AI_LLM:heuristic}
    sop:
      directory-ingestion:
        # Hierarchical SOP ingest is expensive; enable only in dedicated ITs.
        enabled: false
  jwt:
    access-token-minutes: 15
    terminal-switch-token-minutes: 5
    refresh-token-days: 7
    allow-ephemeral: true
  media:
    provider: MINIO
    bucket: invsys-media-test
    region: us-east-1
    path-style-access: true
    create-bucket-if-missing: true
    max-bytes: 15728640
    avatar-max-bytes: 2097152
    evidence-max-bytes: 10485760
    access-key: invsys
    secret-key: invsyssecret
  stripe:
    webhook-secret: whsec_mock_secret
    platform-webhook-secret: whsec_mock_secret
    secret-key: sk_test_mock
  easypost:
    api-key: easypost_mock_key
  shopify:
    api-key: shopify_mock_key
  webhooks:
    shopify-secret: shopify_mock_secret
    easypost-secret: easypost_mock_secret
    accounting-secret: accounting_mock_secret
  integration:
    accounting:
      mock: true
    outbox:
      dispatcher-enabled: false
  observability:
    alert-scan-interval-ms: 3600000
  security:
    public-signup-enabled: true
    cors-allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:5175,http://localhost:3003
    cors-include-verified-domains: true
    cors-cache-seconds: 5
    cookie-secure: false
    cookie-same-site: Lax
    expose-magic-token: true
  redis:
    enabled: false
  actuator:
    scrape-allowed-cidrs: 127.0.0.1/32,::1/128
