server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve api-gateway at request time (gateway starts after UIs).
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Fonts are self-hosted. script-src hashes are the exact Vite plugin-legacy
    # snippets (no 'unsafe-inline' — those hashes do not allow arbitrary JS).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-ZxAi3a7m9Mzbc+Z1LGuCCK5Xee6reDkEPRas66H9KSo=' 'sha256-+5XkZFazzJo8n0iOP4ti/cLCMUudTf//Mzkb7xNPXIc=' 'sha256-MS6/3FCg4WjP9gwgaBGwLpRCY6fZBgwmhVCdrPrNf3E=' 'sha256-tQjf8gvb2ROOMapIxFvFAYBeUJ0v1HCbOcSmDNXGtDo='; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SSE dashboard stream — disable proxy buffering.
    location = /api/v1/dashboard/stream {
        set $gw api-gateway;
        proxy_pass http://$gw:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Support copilot SSE — disable buffering so tokens stream promptly.
    location = /api/v1/support/chat {
        set $gw api-gateway;
        proxy_pass http://$gw:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-User-Roles $http_x_user_roles;
        proxy_set_header X-Current-Route $http_x_current_route;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding off;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Route API traffic through the API gateway (dynamic CORS + edge headers).
    location /api/ {
        set $gw api-gateway;
        proxy_pass http://$gw:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve multi-value Set-Cookie (access + refresh) through the edge.
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        proxy_pass_header X-Request-Id;
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Credentials;
    }

    location /actuator/ {
        set $gw api-gateway;
        proxy_pass http://$gw:8080;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    location /api-docs {
        return 404;
    }

    location /swagger-ui.html {
        return 404;
    }

    location /oauth2/ {
        set $gw api-gateway;
        proxy_pass http://$gw:8080;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /login/oauth2/ {
        set $gw api-gateway;
        proxy_pass http://$gw:8080;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
