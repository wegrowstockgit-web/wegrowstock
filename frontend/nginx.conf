server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # SSE dashboard stream — disable proxy buffering.
    location = /api/v1/dashboard/stream {
        proxy_pass http://api-gateway:8080/api/v1/dashboard/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Support copilot SSE — disable buffering so tokens stream promptly.
    location = /api/v1/support/chat {
        proxy_pass http://api-gateway:8080/api/v1/support/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-User-Roles $http_x_user_roles;
        proxy_set_header X-Current-Route $http_x_current_route;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding off;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Route API traffic through the API gateway (dynamic CORS + edge headers).
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header X-Warehouse-Id $http_x_warehouse_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve multi-value Set-Cookie (access + refresh) through the edge.
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        proxy_pass_header X-Request-Id;
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Credentials;
    }

    location /actuator/ {
        proxy_pass http://api-gateway:8080/actuator/;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    location /api-docs {
        proxy_pass http://api-gateway:8080/api-docs;
    }

    location /swagger-ui.html {
        proxy_pass http://api-gateway:8080/swagger-ui.html;
    }

    location /oauth2/ {
        proxy_pass http://api-gateway:8080/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /login/oauth2/ {
        proxy_pass http://api-gateway:8080/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
