services:
  db:
    # pgvector extension required for support RAG (Flyway V089+)
    image: pgvector/pgvector:pg16
    container_name: invsys-db
    environment:
      POSTGRES_DB: invsys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - invsys_pgdata:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./ops/demo_seed.sql:/seed/demo_seed.sql:ro
      - ./ops/demo_seed_tenants_extra.sql:/seed/demo_seed_tenants_extra.sql:ro
      - ./ops/fix_passwords.sql:/seed/fix_passwords.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invsys"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: invsys-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Transaction-mode multiplexer in front of Postgres (protects against connection storms).
  # Explicit ini/userlist avoids edoburu auth_user/auth_query defaults that break JDBC auth.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: invsys-pgbouncer
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Required by image entrypoint even when ini is mounted (userlist seed).
      DB_USER: app_user
      DB_PASSWORD: app_user_secret
      DB_HOST: db
      DB_NAME: invsys
      AUTH_TYPE: plain
    volumes:
      - ./ops/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./ops/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U app_user -d invsys"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: invsys-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_ACCESS_KEY:-invsys}
      MINIO_ROOT_PASSWORD: ${MEDIA_SECRET_KEY:-invsyssecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - invsys_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: invsys-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY:-invsys}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:-invsyssecret}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MEDIA_ACCESS_KEY" "$$MEDIA_SECRET_KEY"
        mc mb -p local/invsys-media || true
        mc anonymous set none local/invsys-media || true
        mc mb -p local/archives-db-backups || true
        mc anonymous set none local/archives-db-backups || true
        mc version enable local/archives-db-backups || true
        # Local MinIO stand-in for AWS Glacier@30d / expire@365d (see ops/terraform/s3-db-backups).
        mc ilm rule add local/archives-db-backups --prefix "postgres/" --expire-days 365 || true
        cat > /tmp/cors.json <<'EOF'
        {
          "CORSRules": [{
            "AllowedOrigins": ["*"],
            "AllowedMethods": ["GET", "PUT", "POST", "HEAD", "DELETE"],
            "AllowedHeaders": ["*"],
            "ExposeHeaders": ["ETag", "x-amz-request-id"],
            "MaxAgeSeconds": 3600
          }]
        }
        EOF
        mc cors set local/invsys-media /tmp/cors.json || true
        exit 0

  # Nightly pg_dump → gzip → MinIO/S3 bucket archives-db-backups (disaster recovery).
  db-backup:
    build:
      context: ./ops/db-backup
      dockerfile: Dockerfile
    container_name: invsys-db-backup
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: invsys
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: archives-db-backups
      AWS_ACCESS_KEY_ID: ${MEDIA_ACCESS_KEY:-invsys}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_SECRET_KEY:-invsyssecret}
      AWS_DEFAULT_REGION: us-east-1
      BACKUP_CRON: ${DB_BACKUP_CRON:-0 2 * * *}
      BACKUP_RUN_ON_START: ${DB_BACKUP_RUN_ON_START:-false}
    restart: unless-stopped

  # Observability (LGTM) — ingestion stays on the Compose network only.
  # Grafana UI is published on host :3001; Prometheus/Loki/Tempo are not.
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: invsys-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - invsys_prometheus:/prometheus
    expose:
      - "9090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

  loki:
    image: grafana/loki:3.4.2
    container_name: invsys-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./ops/observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - invsys_loki:/loki
    expose:
      - "3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

  tempo:
    image: grafana/tempo:2.7.1
    container_name: invsys-tempo
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    volumes:
      - ./ops/observability/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - invsys_tempo:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

  grafana:
    image: grafana/grafana:11.5.2
    container_name: invsys-grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    ports:
      - "3001:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - invsys_grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        WITH_CHATBOT: ${INVSYS_WITH_CHATBOT:-true}
    container_name: invsys-api
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      loki:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev,docker
      # Runtime JDBC goes through PgBouncer; Flyway stays on db:5432 (see application-docker.yml).
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_NAME: invsys
      DB_USER: app_user
      DB_PASSWORD: app_user_secret
      FLYWAY_USER: app_owner
      FLYWAY_PASSWORD: app_owner_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      INVSYS_CHATBOT_ENABLED: ${INVSYS_CHATBOT_ENABLED:-true}
      # Support Co-Pilot / RAG — set GEMINI_API_KEY in .env for gemini-2.5-flash + text-embedding-004
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPPORT_AI_LLM: ${SUPPORT_AI_LLM:-gemini}
      SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL: ${SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL:-gemini-2.5-flash}
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: Lax
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      STRIPE_WEBHOOK_SECRET: whsec_mock_secret
      SHOPIFY_WEBHOOK_SECRET: shopify_mock_secret
      EASYPOST_WEBHOOK_SECRET: easypost_mock_secret
      ACCOUNTING_WEBHOOK_SECRET: accounting_mock_secret
      PUBLIC_SIGNUP_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
      CORS_INCLUDE_VERIFIED_DOMAINS: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MEDIA_PROVIDER: MINIO
      MEDIA_ENDPOINT: http://minio:9000
      MEDIA_PUBLIC_ENDPOINT: ${MEDIA_PUBLIC_ENDPOINT:-http://localhost:9000}
      MEDIA_BUCKET: invsys-media
      MEDIA_REGION: us-east-1
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY:-invsys}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:-invsyssecret}
      MEDIA_PATH_STYLE: "true"
      MEDIA_CREATE_BUCKET: "true"
      # Base OTLP HTTP endpoint — Spring Boot appends /v1/traces.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      LOKI_URL: http://loki:3100/loki/api/v1/push
    # Not published — only reachable via api-gateway on the Docker network
    expose:
      - "8080"
    volumes:
      - ./ops/jwt:/run/jwt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    image: nginx:1.27-alpine
    container_name: invsys-api-gateway
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./ops/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # Prefer 127.0.0.1 — alpine wget to "localhost" can hit IPv6 ::1 while nginx listens on IPv4.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_CHATBOT: ${VITE_ENABLE_CHATBOT:-true}
    container_name: invsys-web
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  invsys_pgdata:
  invsys_minio:
  invsys_prometheus:
  invsys_loki:
  invsys_tempo:
  invsys_grafana:
