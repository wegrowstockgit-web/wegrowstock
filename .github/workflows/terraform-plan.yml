# Pre-flight: fmt, validate, security scan, cost-aware plan on PRs to develop/main.
name: Terraform Plan (PR)

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "ops/terraform/infra/**"
      - ".github/workflows/terraform-*.yml"
      - ".github/workflows/infra-stress-test-scale.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: ops/terraform/infra
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: fmt / validate / scan / plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Configure AWS credentials (OIDC → Test role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TEST }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: invsys-gha-tf-plan-${{ github.run_id }}

      - name: Terraform init
        id: init
        run: terraform init -input=false

      - name: Select test workspace
        run: |
          terraform workspace select test || terraform workspace new test

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: true

      - name: Terraform plan (test profile)
        id: plan
        run: |
          set -euo pipefail
          terraform plan \
            -input=false \
            -no-color \
            -var-file=envs/test.tfvars \
            -out=tfplan \
            2>&1 | tee plan.txt
          terraform show -no-color tfplan > plan-show.txt

      - name: Post plan comment on PR
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = '${{ env.TF_WORKING_DIR }}';
            const read = (f) => {
              try { return fs.readFileSync(`${path}/${f}`, 'utf8'); }
              catch { return '(not available)'; }
            };
            const plan = read('plan-show.txt');
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n… truncated …'
              : plan;
            const fmt = '${{ steps.fmt.outcome }}';
            const init = '${{ steps.init.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const planOutcome = '${{ steps.plan.outcome }}';
            const body = [
              '### Terraform pre-flight (test workspace)',
              '',
              `| Check | Result |`,
              `| --- | --- |`,
              `| \`terraform fmt -check\` | ${fmt} |`,
              `| \`terraform init\` | ${init} |`,
              `| \`terraform validate\` | ${validate} |`,
              `| \`terraform plan\` | ${planOutcome} |`,
              '',
              '<details><summary>Plan overview</summary>',
              '',
              '```hcl',
              truncated,
              '```',
              '',
              '</details>',
              '',
              `_Workflow: \`${{ github.workflow }}\` · run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '### Terraform pre-flight (test workspace)';
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if fmt or plan failed
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure' || steps.validate.outcome == 'failure'
        run: exit 1
