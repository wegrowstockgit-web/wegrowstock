# CI — backend data plane (invsys-app) + control plane (invsys-admin-api)
name: CI Backend

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wms-api:
    name: invsys-app (data plane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package + unit/IT (invsys-app)
        run: >
          mvn -B -ntp
          -Dsurefire.failIfNoSpecifiedTests=false
          -pl invsys-app -am
          test
          -Dtest=ControlPlaneTenantEntitlementHttpTest,RequireModuleAspectTest,TenantSubscriptionServiceParseTest,AuthFlowTest

  admin-api:
    name: invsys-admin-api (control plane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package + IT (invsys-admin-api)
        run: >
          mvn -B -ntp
          -Dsurefire.failIfNoSpecifiedTests=false
          -pl invsys-admin-api -am
          test
          -Dtest=AdminAuthHttpTest,ControlPlaneTenantHttpTest
